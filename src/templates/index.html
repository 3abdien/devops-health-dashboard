<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Health Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 30px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .card h2 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 36px;
            font-weight: bold;
        }

        .cpu   { color: #38bdf8; }
        .mem   { color: #a78bfa; }
        .disk  { color: #fb923c; }

        .chart-container {
            background: #1e293b;
            border-radius: 10px;
            padding: 25px;
        }

        .chart-container h2 {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>🖥️ DevOps Health Dashboard</h1>
    <p>Live system metrics — auto-refreshes every 10 seconds</p>

    <!-- Current Value Cards -->
    <div class="cards">
        <div class="card">
            <h2>CPU Usage</h2>
            <div class="value cpu" id="cpu-value">--%</div>
        </div>
        <div class="card">
            <h2>Memory Usage</h2>
            <div class="value mem" id="mem-value">--%</div>
        </div>
        <div class="card">
            <h2>Disk Usage</h2>
            <div class="value disk" id="disk-value">--%</div>
        </div>
    </div>

    <!-- Line Chart -->
    <div class="chart-container">
        <h2>📈 Metrics Over Time</h2>
        <canvas id="metricsChart"></canvas>
    </div>

    <script>
        // Initialize the chart
        const ctx = document.getElementById('metricsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'CPU %',
                        data: [],
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56,189,248,0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Memory %',
                        data: [],
                        borderColor: '#a78bfa',
                        backgroundColor: 'rgba(167,139,250,0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Disk %',
                        data: [],
                        borderColor: '#fb923c',
                        backgroundColor: 'rgba(251,146,60,0.1)',
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#e2e8f0' }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#94a3b8',
                            maxTicksLimit: 8
                        },
                        grid: { color: '#1e293b' }
                    },
                    y: {
                        min: 0,
                        max: 100,
                        ticks: { color: '#94a3b8' },
                        grid: { color: '#334155' }
                    }
                }
            }
        });

        // Fetch data and update chart
        function updateDashboard() {
            fetch('/api/metrics')
                .then(response => response.json())
                .then(data => {
                    // Update chart
                    chart.data.labels          = data.labels;
                    chart.data.datasets[0].data = data.cpu;
                    chart.data.datasets[1].data = data.memory;
                    chart.data.datasets[2].data = data.disk;
                    chart.update();

                    // Update cards with latest values
                    const last = data.cpu.length - 1;
                    document.getElementById('cpu-value').textContent  = data.cpu[last] + '%';
                    document.getElementById('mem-value').textContent  = data.memory[last] + '%';
                    document.getElementById('disk-value').textContent = data.disk[last] + '%';
                });
        }

        // Run immediately then every 10 seconds
        updateDashboard();
        setInterval(updateDashboard, 10000);
    </script>

</body>
</html>
