name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test collector runs
        run: python src/collector.py

      - name: Test dashboard imports
        run: python -c "from src.dashboard import app; print('✅ Dashboard OK')"

      - name: Build Docker image
        run: docker build -t devops-health-dashboard .